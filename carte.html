<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte des sites — AstroNuit</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/map.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <canvas id="stars-canvas"></canvas>
  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container">
        <a href="index.html" class="navbar-brand">
          <span class="brand-icon">✦</span>
          <span class="brand-name">Astro<span>Nuit</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav">
          <li><a href="lieux.html" class="nav-link"><span>📍</span> Spots</a></li>
          <li><a href="evenements.html" class="nav-link"><span>📅</span> Sorties</a></li>
          <li><a href="carte.html" class="nav-link active"><span>🗺️</span> Carte</a></li>
          <li><a href="ciel-du-soir.html" class="nav-link"><span>🔭</span> Ciel du soir</a></li>
          <li><a href="galerie.html" class="nav-link"><span>📸</span> Galerie</a></li>
        </ul>
        <div class="navbar-actions">
          <a href="connexion.html" class="btn btn-outline btn-sm" id="btn-login">Connexion</a>
          <a href="connexion.html#inscription" class="btn btn-primary btn-sm" id="btn-register">Rejoindre</a>
          <div class="navbar-user" id="navbar-user" style="display:none;">
            <div class="avatar" id="user-avatar">?</div>
          </div>
          <button class="navbar-toggle" id="navbar-toggle"><span></span><span></span><span></span></button>
        </div>
      </div>
    </nav>

    <main style="padding-top: var(--nav-height);">
      <!-- Carte plein écran -->
      <div class="map-fullscreen-layout">
        <!-- Sidebar filtres -->
        <div class="map-sidebar">
          <div class="map-sidebar-header">
            <h2>Sites & Sorties</h2>
            <button class="btn btn-ghost btn-sm" id="btn-sidebar-toggle">☰</button>
          </div>

          <!-- Filtres -->
          <div class="map-filters">
            <h3>Couches</h3>
            <label class="layer-toggle">
              <input type="checkbox" id="layer-events" checked>
              <span class="layer-dot" style="background: #8b5cf6;"></span>
              Sorties à venir
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layer-sites" checked>
              <span class="layer-dot" style="background: #10b981;"></span>
              Sites favoris (Bortle ≤ 3)
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layer-sites-medium">
              <span class="layer-dot" style="background: #3b82f6;"></span>
              Sites (Bortle 4-5)
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layer-sites-poor">
              <span class="layer-dot" style="background: #f59e0b;"></span>
              Sites (Bortle ≥ 6)
            </label>
          </div>

          <div class="map-filters" style="margin-top: 1rem;">
            <h3>Région</h3>
            <select class="form-select" id="map-region">
              <option value="">Toute la France</option>
              <option>Île-de-France</option>
              <option>Auvergne-Rhône-Alpes</option>
              <option>Bretagne</option>
              <option>Occitanie</option>
              <option>Provence-Alpes-Côte d'Azur</option>
              <option>Normandie</option>
            </select>
          </div>

          <!-- Liste des sites -->
          <div class="sites-list" id="sites-list">
            <h3>Sites répertoriés <span id="sites-count" class="badge badge-primary">7</span></h3>
            <div id="sites-list-items">
              <!-- Généré par JS -->
            </div>
          </div>

          <div style="padding: 1rem;">
            <button class="btn btn-primary btn-sm" style="width:100%;" id="btn-add-site">
              + Signaler un site
            </button>
          </div>
        </div>

        <!-- Carte -->
        <div class="map-main">
          <div id="main-map"></div>

          <!-- Contrôles flottants -->
          <div class="map-controls">
            <button class="map-control-btn" id="btn-geolocate" title="Ma position">📍</button>
            <button class="map-control-btn" id="btn-fullscreen" title="Plein écran">⛶</button>
          </div>

          <!-- Légende -->
          <div class="map-legend">
            <div class="legend-title">Bortle</div>
            <div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span>1-2 Noir</div>
            <div class="legend-item"><span class="legend-dot" style="background:#3b82f6;"></span>3-4 Rural</div>
            <div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span>5-6 Suburban</div>
            <div class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span>7+ Urbain</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/stars.js"></script>
  <script type="module" src="js/pages/carte.page.js"></script>
</body>
</html>
